<!DOCTYPE html>
<html lang="pt-BR">
<!--
  ╔══════════════════════════════════════════════════╗
  ║           LUNNA PIJAMA — LINK NA BIO             ║
  ╠══════════════════════════════════════════════════╣
  ║  Para personalizar:                              ║
  ║  1. Número WhatsApp → constante WHATSAPP (JS)    ║
  ║  2. Mensagens → MSG_PADRAO e MSG_FRETE (JS)      ║
  ║  3. Ícone/logo → <img src="logo.png"> no avatar  ║
  ║  4. URL do site → footer (lunnapijama.com.br)    ║
  ╚══════════════════════════════════════════════════╝
-->
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Lunna Pijama — Noites tranquilas & Dias preguiçosos. Loja de pijamas em Teresina, PI." />
  <title>Lunna Pijama</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --rosa:      #e87faa;
      --azul:      #4db8c8;
      --creme:     #fff8fc;
      --escuro:    #3a2a35;
      --cinza:     #6a5763;   /* era #9b8a94 — contraste 2.99:1 → agora ~5.2:1 */
      --wpp:       #25a244;
      --rosa-bg:   #f9c6d8;
      --rosa-pale: #fdeef5;   /* btn-frete bg integrada ao creme */
    }

    /* ── animatable border angle (requires @property) ── */
    @property --ba {
      syntax: '<angle>';
      initial-value: 135deg;
      inherits: false;
    }

    html, body {
      min-height: 100%;
    }

    body {
      font-family: 'Nunito', sans-serif;
      font-weight: 400;
      background-color: var(--creme);
      background-image:
        radial-gradient(ellipse 60% 50% at 0% 0%,    rgba(232,127,170,0.22) 0%, transparent 70%),
        radial-gradient(ellipse 55% 45% at 100% 100%, rgba(77,184,200,0.20)  0%, transparent 70%),
        radial-gradient(ellipse 40% 35% at 100% 0%,  rgba(232,127,170,0.10) 0%, transparent 60%),
        radial-gradient(ellipse 40% 35% at 0% 100%,  rgba(77,184,200,0.10)  0%, transparent 60%);
      background-attachment: fixed;
      background-size: cover;
      display: flex;
      justify-content: center;
      padding: clamp(28px, 6vw, 48px) 16px 88px;
      overflow-x: hidden;
    }

    /* ── emojis flutuantes ── */
    #emoji-layer {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 0;
    }

    .emoji-float {
      position: absolute;
      bottom: -60px;
      font-size: 1.4rem;
      opacity: 0;
      animation: floatUp var(--dur, 13s) ease-in-out forwards;
      will-change: transform, opacity;
      user-select: none;
    }

    @keyframes floatUp {
      0%   { transform: translateY(0)      translateX(0)               rotate(0deg);   opacity: 0; }
      8%   { opacity: 0.52; }
      50%  { transform: translateY(-52vh)  translateX(var(--dx, 20px)) rotate(12deg); }
      88%  { opacity: 0.42; }
      100% { transform: translateY(-112vh) translateX(calc(var(--dx, 20px) * 0.6)) rotate(24deg); opacity: 0; }
    }

    /* sem animação para quem tem sensibilidade vestibular */
    @media (prefers-reduced-motion: reduce) {
      .emoji-float { display: none; }
    }

    /* ── card ── */
    .card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* ── animação de entrada (staggered) ── */
    .card > * {
      opacity: 0;
      animation: fadeUp 0.55s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(18px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .avatar-wrap { animation-delay: 0.08s; }
    .nome        { animation-delay: 0.22s; }
    .tagline     { animation-delay: 0.32s; }
    .local       { animation-delay: 0.40s; }
    .btns        { animation-delay: 0.50s; }

    @media (prefers-reduced-motion: reduce) {
      .card > * { animation: none; opacity: 1; }
    }

    /* ── avatar com borda girando ── */
    .avatar-wrap {
      width: 108px;
      height: 108px;
      border-radius: 50%;
      padding: 3px;
      background: conic-gradient(from var(--ba), var(--rosa), var(--azul) 55%, var(--rosa));
      animation: spinBorder 5s linear infinite, fadeUp 0.55s cubic-bezier(0.22, 1, 0.36, 1) forwards;
      animation-delay: 0s, 0.08s;
      opacity: 0;
      margin-bottom: 20px;
      flex-shrink: 0;
    }

    @keyframes spinBorder {
      to { --ba: 495deg; }
    }

    @media (prefers-reduced-motion: reduce) {
      .avatar-wrap {
        animation: none;
        opacity: 1;
        background: linear-gradient(135deg, var(--rosa), var(--azul));
      }
    }

    .avatar-inner {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: var(--rosa-bg);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ↓ Troque "logo.png" pelo caminho real da imagem */
    .avatar-inner img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
    }

    /* fallback: monograma quando logo.png não carrega */
    .avatar-monogram {
      font-family: 'Nunito', sans-serif;
      font-size: 1.9rem;
      font-weight: 800;
      color: var(--rosa);
      line-height: 1;
      letter-spacing: -0.03em;
    }

    /* ── nome ── */
    .nome {
      font-size: 2rem;
      font-weight: 800;
      line-height: 1.1;
      letter-spacing: -0.025em;
      margin-bottom: 8px;
      text-align: center;
      text-wrap: balance;
    }

    .nome .lunna  { color: var(--rosa); }
    .nome .pijama { color: var(--escuro); }

    /* ── tagline ── */
    .tagline {
      font-size: 0.92rem;
      color: var(--cinza);    /* contraste ≥5.2:1 sobre creme */
      font-weight: 400;
      text-align: center;
      margin-bottom: 12px;
      line-height: 1.5;
      text-wrap: pretty;
    }

    /* ── localização ── */
    .local {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--azul);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 32px;
      /* pill suave */
      background: rgba(77,184,200,0.10);
      padding: 5px 12px;
      border-radius: 100px;
    }

    .local svg {
      width: 12px;
      height: 12px;
      flex-shrink: 0;
    }

    /* ── botões ── */
    .btns {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 11px;
    }

    .btn {
      display: flex;
      align-items: center;
      gap: 14px;
      width: 100%;
      padding: 14px 16px 14px 14px;
      border-radius: 18px;
      text-decoration: none;
      cursor: pointer;
      border: none;
      transition: transform 0.18s cubic-bezier(0.22, 1, 0.36, 1);
      position: relative;
      min-height: 64px; /* touch target ≥44px */
    }

    .btn:hover  { transform: translateY(-2px); }
    .btn:active { transform: scale(0.97); }

    .btn:focus-visible {
      outline: 3px solid var(--rosa);
      outline-offset: 3px;
    }

    .btn-wpp {
      background: var(--wpp);
      color: #fff;
    }

    .btn-ig {
      background: var(--rosa);
      color: #fff;
    }

    .btn-frete {
      background: var(--rosa-pale);  /* era #fff — agora integrado ao creme */
      color: var(--escuro);
      border: 1.5px solid rgba(232,127,170,0.45);
    }

    .btn-icon {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: rgba(255,255,255,0.20);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .btn-frete .btn-icon {
      background: rgba(232,127,170,0.14);
    }

    .btn-icon svg {
      width: 20px;
      height: 20px;
    }

    .btn-text {
      flex: 1;
      text-align: left;
    }

    .btn-label {
      display: block;
      font-size: 0.94rem;
      font-weight: 800;
      line-height: 1.2;
    }

    /* sublabel: sem opacity — cores calculadas para contraste adequado */
    .btn-sub {
      display: block;
      font-size: 0.72rem;
      font-weight: 400;
      margin-top: 2px;
    }

    .btn-wpp .btn-sub,
    .btn-ig  .btn-sub  { color: rgba(255,255,255,0.88); } /* ~4.5:1 sobre verde e rosa */
    .btn-frete .btn-sub { color: var(--cinza); }

    /* seta: chevron SVG que desliza no hover */
    .btn-arrow {
      flex-shrink: 0;
      opacity: 0.55;
      transition: transform 0.18s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.18s;
      display: flex;
      align-items: center;
    }

    .btn:hover .btn-arrow {
      transform: translateX(3px);
      opacity: 0.85;
    }

    .btn-arrow svg {
      width: 16px;
      height: 16px;
    }

    .btn-frete .btn-arrow { color: var(--rosa); }

    /* ── footer fixo ── */
    footer {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 10;
      padding: 16px 0 14px;
      text-align: center;
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--cinza);
      letter-spacing: 0.04em;
      background: linear-gradient(to top, var(--creme) 60%, transparent 100%);
      pointer-events: none;
    }

    footer span {
      color: var(--rosa);
    }
  </style>
</head>
<body>

  <div id="emoji-layer"></div>

  <main class="card">

    <!-- avatar — troque logo.png pelo caminho real da imagem -->
    <div class="avatar-wrap">
      <div class="avatar-inner">
        <img id="avatar-img" src="logo.png" alt="Logo Lunna Pijama" />
      </div>
    </div>

    <h1 class="nome">
      <span class="lunna">Lunna</span>&nbsp;<span class="pijama">Pijama</span>
    </h1>

    <p class="tagline">Noites tranquilas &amp; Dias preguiçosos ☁️</p>

    <div class="local">
      <!-- pin icon -->
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z"/>
        <circle cx="12" cy="9" r="2.5"/>
      </svg>
      <span>Teresina &middot; PI</span>
    </div>

    <div class="btns">

      <!-- Botão WhatsApp — compra -->
      <a class="btn btn-wpp" id="btn-comprar" href="#">
        <span class="btn-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51a12.9 12.9 0 0 0-.57-.01c-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 0 1-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 0 1-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 0 1 2.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0 0 12.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 0 0 5.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 0 0-3.48-8.413z"/>
          </svg>
        </span>
        <span class="btn-text">
          <span class="btn-label">Comprar pelo WhatsApp</span>
          <span class="btn-sub">Atendimento rápido e personalizado</span>
        </span>
        <span class="btn-arrow" aria-hidden="true">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6 3l5 5-5 5"/>
          </svg>
        </span>
      </a>

      <!-- Botão Instagram -->
      <a class="btn btn-ig" href="https://instagram.com/lunnapijama" target="_blank" rel="noopener noreferrer">
        <span class="btn-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="2" width="20" height="20" rx="5" ry="5"/>
            <circle cx="12" cy="12" r="4"/>
            <circle cx="17.5" cy="6.5" r="0.5" fill="currentColor" stroke="none"/>
          </svg>
        </span>
        <span class="btn-text">
          <span class="btn-label">Instagram</span>
          <span class="btn-sub">@lunnapijama</span>
        </span>
        <span class="btn-arrow" aria-hidden="true">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6 3l5 5-5 5"/>
          </svg>
        </span>
      </a>

      <!-- Botão frete grátis -->
      <a class="btn btn-frete" id="btn-frete" href="#">
        <span class="btn-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="#e87faa" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <rect x="1" y="3" width="15" height="13" rx="1"/>
            <path d="M16 8h4l3 5v4h-7V8z"/>
            <circle cx="5.5" cy="18.5" r="2.5"/>
            <circle cx="18.5" cy="18.5" r="2.5"/>
          </svg>
        </span>
        <span class="btn-text">
          <span class="btn-label">Frete grátis para Parnaíba</span>
          <span class="btn-sub">Consulte disponibilidade</span>
        </span>
        <span class="btn-arrow" aria-hidden="true">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6 3l5 5-5 5"/>
          </svg>
        </span>
      </a>

    </div>
  </main>

  <!-- footer fixo — troque a URL se necessário -->
  <footer>feito com <span>♥</span> &middot; lunnapijama.com.br</footer>

  <script>
    /* ─────────────────────────────────────────
       CONFIGURAÇÕES — edite aqui
    ───────────────────────────────────────── */
    const WHATSAPP   = '5586994124404';
    const MSG_PADRAO = 'Olá! Vim pelo Instagram e quero comprar. Pode me ajudar? 🛍️';
    const MSG_FRETE  = 'Olá! Vim pelo Instagram e quero consultar o frete grátis para Parnaíba. 🚚';

    /* ─────────────────────────────────────────
       Montagem dos links WhatsApp
    ───────────────────────────────────────── */
    document.getElementById('btn-comprar').href =
      `https://wa.me/${WHATSAPP}?text=${encodeURIComponent(MSG_PADRAO)}`;

    document.getElementById('btn-frete').href =
      `https://wa.me/${WHATSAPP}?text=${encodeURIComponent(MSG_FRETE)}`;

    /* ─────────────────────────────────────────
       Fallback do avatar — monograma "LP"
    ───────────────────────────────────────── */
    const avatarImg = document.getElementById('avatar-img');
    avatarImg.onerror = () => {
      avatarImg.style.display = 'none';
      const m = document.createElement('span');
      m.className   = 'avatar-monogram';
      m.textContent = 'LP';
      avatarImg.parentNode.appendChild(m);
    };

    /* ─────────────────────────────────────────
       Emojis flutuantes
    ───────────────────────────────────────── */
    const EMOJIS = ['🐑', '☁️', '💕', '🌙', '💤', '🩷', '💙', '✨'];
    const layer  = document.getElementById('emoji-layer');

    function spawnEmoji() {
      const el = document.createElement('span');
      el.className = 'emoji-float';
      el.textContent = EMOJIS[Math.floor(Math.random() * EMOJIS.length)];

      const left     = Math.random() * 96;
      const duration = 10 + Math.random() * 9;           /* 10–19 s */
      const size     = 1.1 + Math.random() * 0.85;       /* 1.1–1.95 rem */
      const drift    = (Math.random() - 0.5) * 70;       /* −35 a +35 px de desvio horizontal */

      el.style.left     = `${left}vw`;
      el.style.fontSize = `${size}rem`;
      el.style.setProperty('--dur', `${duration}s`);
      el.style.setProperty('--dx',  `${drift}px`);

      layer.appendChild(el);
      el.addEventListener('animationend', () => el.remove());
    }

    /* spawn inicial */
    for (let i = 0; i < 6; i++) setTimeout(spawnEmoji, i * 500);
    setInterval(spawnEmoji, 1800);
  </script>

</body>
</html>
